# Render Blueprint: serves the prebuilt Unity WebGL player in webgl/ as a Static Site.
# Render cannot run Unity, so the player is built locally/CI (see README) and committed.
# The build uses gzip + Unity's JS decompression fallback, so no Content-Encoding headers are required.
services:
  - type: web
    name: poketato-webgl
    runtime: static
    buildCommand: echo "Using the prebuilt Unity WebGL player committed in webgl/"
    staticPublishPath: ./webgl
    headers:
      # File names under Build/ contain content hashes, so they can be cached forever.
      - path: /Build/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
