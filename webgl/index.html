<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poketato · Unity 2.5D 原型</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f141c; overflow: hidden; font-family: system-ui, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0f141c; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e8eefc; gap: 14px; }
    #loading .title { font-size: 22px; letter-spacing: 2px; }
    #loading .bar { width: 320px; height: 10px; border: 2px solid #f8faff; border-radius: 3px; background: #142048; }
    #loading .fill { height: 100%; width: 0; background: #ffd23f; }
    #loading .pct { font-size: 13px; color: #9fb0d8; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="title">宝可肉鸽 · Poketato</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>
  <script>
    // Timing marks read by tools/webgl_perf.mjs (window.__poketato.marks, ms since navigation start).
    window.__poketato = window.__poketato || { marks: {}, reports: [] };
    window.__poketato.marks.htmlStart = performance.now();
    var params = new URLSearchParams(location.search);
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/633c855b072eebe0614c9b55f7766ceb.data.unityweb",
      frameworkUrl: buildUrl + "/4da60ee0dccd129e34903069bcdd2178.framework.js.unityweb",
      codeUrl: buildUrl + "/ad61fb7a46e8ad4b0f4a0d988af8061e.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Poketato",
      productName: "Poketato",
      productVersion: "0.2.0",
      // Rendering at device pixel ratio 1 by default keeps fill-rate predictable on HiDPI screens (?dpr=2 to override).
      devicePixelRatio: parseFloat(params.get("dpr") || "1"),
    };
    var canvas = document.querySelector("#unity-canvas");
    var script = document.createElement("script");
    script.src = buildUrl + "/a4867b85992aee1f879625bf8f72f284.loader.js";
    script.onload = function () {
      window.__poketato.marks.loaderReady = performance.now();
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("fill").style.width = (100 * progress) + "%";
        document.getElementById("pct").textContent = Math.round(100 * progress) + "%";
        if (progress >= 0.9 && !window.__poketato.marks.downloaded) window.__poketato.marks.downloaded = performance.now();
      }).then(function (instance) {
        window.__poketato.marks.instanceReady = performance.now();
        window.unityInstance = instance;
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        window.__poketato.error = String(message);
        document.getElementById("pct").textContent = "加载失败：" + message;
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("click", function () { canvas.focus(); });
  </script>
</body>
</html>
